name: Jornada
options:
  bundleIdPrefix: org.universal
  deploymentTarget: { iOS: "17.0" }
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "6"
    DEVELOPMENT_TEAM: L52826S635
    CODE_SIGN_STYLE: Automatic
targets:
  Jornada:
    type: application
    platform: iOS
    sources:
      - Jornada/Sources
      - Jornada/Resources
      - Jornada/PrivacyInfo.xcprivacy
      - Jornada/Shared
      - { path: Jornada/Icon/AppIcon.icon, type: file, buildPhase: resources }
    dependencies:
      - target: JornadaWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.universal.jornada
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          API_BASE_URL: "http:/$()/localhost:3000"
        Release:
          API_BASE_URL: "https:/$()/jornada-cms.vercel.app"
    entitlements:
      path: Jornada/Jornada.entitlements
      properties:
        aps-environment: development   # o Xcode troca para "production" ao assinar para distribuição
        com.apple.security.application-groups: [group.org.universal.jornada]
    info:
      path: Jornada/Info.plist
      properties:
        CFBundleDisplayName: Carreira da Fé
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest: { UIApplicationSupportsMultipleScenes: false }
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSAppTransportSecurity: { NSAllowsLocalNetworking: true }
        API_BASE_URL: "$(API_BASE_URL)"
        ITSAppUsesNonExemptEncryption: false   # só HTTPS padrão do sistema
        NSPhotoLibraryUsageDescription: "Para escolher sua foto de perfil."
        UIBackgroundModes: [remote-notification]
  JornadaWidget:
    type: app-extension
    platform: iOS
    sources:
      - JornadaWidget
      - Jornada/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.universal.jornada.widget
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
    entitlements:
      path: JornadaWidget/JornadaWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.org.universal.jornada]
    info:
      path: JornadaWidget/Info.plist
      properties:
        CFBundleDisplayName: Carreira da Fé
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  JornadaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [JornadaUITests]
    dependencies: [{ target: Jornada }]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.universal.jornada.uitests
        TEST_TARGET_NAME: Jornada
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Jornada:
    build: { targets: { Jornada: all, JornadaUITests: [test] } }
    test: { targets: [JornadaUITests] }
